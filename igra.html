    c.on('data',d=>{ let m; try{ m=JSON.parse(d); }catch(e){ return; }

        if(ex){ ex.name=m.name; ex.f=m.f; } else if(L.players.length<6) L.players.push({tok:m.tok,name:m.name,f:m.f});
        L.players=L.players.filter((p,i,a)=>a.findIndex(q=>q.f===p.f)===i); netSend({t:'lobby',L}); renderAny(); }
      else if(m.t==='leave'&&!G){ NET.lobby.players=NET.lobby.players.filter(p=>p.tok!==m.tok); netSend({t:'lobby',L:NET.lobby}); renderAny(); }
      else if(m.t==='state'&&m.G&&(!G||(m.G.v||0)>=(G.v||0))){ G=m.G; NET.last=JSON.stringify(G); save(); netSend({t:'state',G}); renderAny(); }
    });
    c.on('close',()=>{ NET.conns=NET.conns.filter(x=>x!==c); });
  });
}
function hostStart(){
  const L=NET.lobby; if(L.players.length<2){ alert('Нужно минимум 2 игрока'); return; }
  newGame(L.players.map(p=>p.f)); L.players.forEach((p,i)=>{ G.players[i].tok=p.tok; G.players[i].name=p.name; });
  G.online=true; G.v=1; NET.last=''; render();
}
// ---- гость ----
function joinRoom(room){
  NET.on=true; NET.host=false; NET.room=room; lsSet('ring_room',room); lsSet('ring_role','guest');
  NET.status='Подключение к комнате '+room+'…'; renderAny();
  if(typeof Peer==='undefined'){ NET.status='Не загрузилась сетевая библиотека. Проверьте интернет и обновите страницу.'; renderAny(); return; }
  NET.peer=new Peer();
  NET.peer.on('open',()=>{ const c=NET.peer.connect(PEER_PREFIX+room,{reliable:true}); NET.hostConn=c;
    c.on('open',()=>{ NET.status='Подключено'; const j=lsGet('ring_join'); if(j&&!G){ try{ const o=JSON.parse(j); c.send(JSON.stringify({t:'join',tok:NET.tok,name:o.name,f:o.f})); }catch(e){} } renderAny(); });
    c.on('data',d=>{ let m; try{ m=JSON.parse(d); }catch(e){ return; }
      if(m.t==='lobby'){ NET.lobby=m.L; renderAny(); }
      else if(m.t==='state'&&m.G&&(!G||(m.G.v||0)>=(G.v||0))){ G=m.G; NET.last=JSON.stringify(G); save(); renderAny(); } });
    c.on('close',()=>{ NET.status='Связь с хостом потеряна. Переподключение…'; renderAny(); setTimeout(()=>joinRoom(room),4000); });
  });
  NET.peer.on('error',e=>{ NET.status=e.type==='peer-unavailable'?'Комната не найдена: хост ещё не открыл её или вышел. Повтор через 5 с…':'Ошибка сети: '+e.type; renderAny(); if(e.type==='peer-unavailable'||e.type==='network') setTimeout(()=>{ try{NET.peer.destroy();}catch(_){} joinRoom(room); },5000); });
}
function guestJoin(name,f){ lsSet('ring_join',JSON.stringify({name,f})); if(NET.hostConn&&NET.hostConn.open) NET.hostConn.send(JSON.stringify({t:'join',tok:NET.tok,name,f})); }
function leaveOnline(){ try{ NET.peer&&NET.peer.destroy(); }catch(e){} ['ring_room','ring_role','ring_join'].forEach(k=>{ try{localStorage.removeItem(k);}catch(e){} }); location.hash=''; location.reload(); }
</script>

// 7 приказов у каждой фракции, по одному каждого вида
const ORD = {
 A1:{t:'A',b:1,label:'Атака +1',ic:'⚔+1'}, A0:{t:'A',b:0,label:'Атака 0',ic:'⚔0'}, Am:{t:'A',b:-1,label:'Атака −1',ic:'⚔−1'},
 D2:{t:'D',b:2,label:'Защита +2',ic:'🛡+2'}, D1:{t:'D',b:1,label:'Защита +1',ic:'🛡+1'},
 S1:{t:'S',b:1,label:'Поддержка +1',ic:'✚+1'}, S0:{t:'S',b:0,label:'Поддержка 0',ic:'✚0'},
};
const COST = { 'п':1, 'о':1, up:1, mine:1, barracks:1, fort:3 };

// ===== Состояние =====
let G=null; const LS='ringgame_v3';
function lsKey(){ return (typeof NET!=='undefined'&&NET.on)?'ringgame_room_'+NET.room:LS; }
function save(){ try{ localStorage.setItem(lsKey(), JSON.stringify(G)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(lsKey()); return s?JSON.parse(s):null; }catch(e){ return null; } }

function newGame(fnames){
  const players=fnames.map(f=>({f, coins:3, hand:HEROES[f].map((_,i)=>i), discard:[], alive:true, home:T(FACTIONS[f].home)}));
  const units=Array(N).fill(null).map(()=>[]), owner=Array(N).fill(-1), bld=Array(N).fill(null).map(()=>({}));
  players.forEach((p,pi)=>{ units[p.home]=['п']; owner[p.home]=pi; });
  const hist=[...players.keys()].sort((a,b)=>HIST_ORDER.indexOf(players[a].f)-HIST_ORDER.indexOf(players[b].f));
  G={players,units,owner,bld,orders:Array(N).fill(null),round:1,phase:'build',arken:[...hist],palantir:[...hist],ring:[...hist],
     ringUsed:false,idx:0,log:['Игра началась. Раунд 1.'],battle:null,sel:null,winner:null,gate:null,cur:null};
  startPlan();
}

const P=i=>G.players[i]; const fc=i=>FACTIONS[P(i).f].c;
function log(s){ G.log.push(s); if(G.log.length>300) G.log.shift(); }
function alivePlayers(){ return G.arken.filter(pi=>P(pi).alive); }
function hasWalls(t){ return CASTLE.has(t) || !!G.bld[t].fort; }
function canRecruitAt(t){ return hasWalls(t) || !!G.bld[t].barracks; }
function count(pi,u){ let c=0; for(let t=0;t<N;t++) if(G.owner[t]===pi) for(const x of G.units[t]) if(x===u) c++; return c; }
function terrCount(pi){ return G.owner.filter(o=>o===pi).length; }
function hasFort(pi){ for(let t=0;t<N;t++) if(G.owner[t]===pi&&G.bld[t].fort) return true; return false; }
function hasBuildings(t){ const b=G.bld[t]; return !!(b.mine||b.barracks||b.fort); }
function income(pi){ let c=0; for(let t=0;t<N;t++) if(G.owner[t]===pi){ if(G.bld[t].mine) c++; if(CASTLE.has(t)) c++; if(G.bld[t].fort) c++; } if(G.arken[0]===pi) c++; return c; }
function gate(pi,msg){ G.gate={pi,msg}; G.cur=pi; save(); }
function strength(list,vsWalls){ return list.reduce((s,u)=>s+unitStr(u,vsWalls),0); }

// ===== Фаза владычества: доход и строительство =====
function startBuild(withIncome){
  G.phase='build'; G.idx=0;
  if(withIncome) for(const pi of alivePlayers()){ const inc=income(pi); P(pi).coins+=inc; log(`${P(pi).f}: доход +${inc}.`); }
  nextBuilder();
}
function nextBuilder(){
  const list=alivePlayers();
  if(G.idx<list.length){ const pi=list[G.idx]; G.decrees=0; return gate(pi,'Владычество: нанимайте войска и стройте постройки. Монет: '+P(pi).coins+', указов: '+decreeLimit(pi)+'.'); }
  startPlan();
}
function decreeLimit(pi){ return 5+(G.arken.find(i=>P(i).alive)===pi?1:0); }
function buildDone(){ G.idx++; nextBuilder(); }
function buyAt(t,what){
  const pi=G.cur, p=P(pi), u=G.units[t], b=G.bld[t];
  if(G.owner[t]!==pi) return 'Это не ваша территория';
  const pay=c=>{ if(p.coins<c) throw 'Не хватает монет'; p.coins-=c; };
  try{
    if((G.decrees||0)>=decreeLimit(pi)) throw 'Указы на этот ход закончились';
    if(what==='п'||what==='о'){ if(!canRecruitAt(t)) throw 'Нанимать можно только в замке, крепости или где есть казарма'; if(u.length>=CAP) throw 'На территории уже '+CAP+' отряда'; if(count(pi,what)>=UNIT[what].lim) throw 'Лимит: '+UNIT[what].name+' — не больше '+UNIT[what].lim; pay(COST[what]); u.push(what); log(`${p.f}: ${UNIT[what].name.toLowerCase()} в «${D.names[t]}».`); }
    else if(what==='up_к'||what==='up_э'){ if(!canRecruitAt(t)) throw 'Улучшать можно только в замке, крепости или где есть казарма'; const from=what==='up_к'?'п':'к', to=what==='up_к'?'к':'э'; const i=u.indexOf(from); if(i<0) throw 'Нет отряда для улучшения'; if(count(pi,to)>=UNIT[to].lim) throw 'Лимит: '+UNIT[to].name+' — не больше '+UNIT[to].lim; pay(COST.up); u[i]=to; log(`${p.f}: ${UNIT[from].name.toLowerCase()} → ${UNIT[to].name.toLowerCase()} в «${D.names[t]}».`); }
    else if(what==='mine'||what==='barracks'){ if(hasWalls(t)) throw 'В замке и крепости шахта и казарма уже есть'; if(b[what]) throw 'Уже построено'; pay(COST[what]); b[what]=true; log(`${p.f}: ${what==='mine'?'шахта':'казарма'} в «${D.names[t]}».`); }
    else if(what==='fort'){ if(CASTLE.has(t)) throw 'Здесь уже замок'; if(b.fort) throw 'Уже есть крепость'; if(hasFort(pi)) throw 'Крепость у фракции может быть только одна'; pay(COST.fort); b.fort=true; delete b.mine; delete b.barracks; log(`${p.f}: крепость в «${D.names[t]}».`); }
    else if(what.startsWith('disband_')){ const u2=what.slice(8); const i=u.indexOf(u2); if(i<0) throw 'Нет такого отряда'; u.splice(i,1); log(`${p.f} распускает: ${UNIT[u2].name.toLowerCase()} в «${D.names[t]}».`); if(!u.length) leaveOrigin(t,pi); }
    else if(what==='destroyFort'){ if(!b.fort) throw 'Нет крепости'; delete b.fort; log(`${p.f} разрушает свою крепость в «${D.names[t]}».`); }
  }catch(e){ return String(e); }
  G.decrees=(G.decrees||0)+1;
  return null;
}

// ===== Фаза замыслов =====
function startPlan(){ G.phase='plan'; G.idx=0; G.orders=Array(N).fill(null); nextPlanner(); }
function nextPlanner(){
  const list=alivePlayers();
  while(G.idx<list.length){ const pi=list[G.idx]; if(G.owner.some((o,t)=>o===pi&&(G.units[t].length||hasBuildings(t)))) return gate(pi,'Замыслы: поставьте приказы (у вас 7 приказов, каждый — один раз).'); G.idx++; }
  log('Приказы раскрыты.');
  const top=G.palantir.find(pi=>P(pi).alive);
  G.phase='palantir'; gate(top,'Палантир: вы можете заменить один свой приказ любым неиспользованным.');
}
function planDone(){ G.idx++; nextPlanner(); }
function usedOrders(pi){ const s=new Set(); G.orders.forEach(o=>{ if(o&&o.p===pi) s.add(o.k); }); return s; }
function setOrder(t,k){ const pi=G.cur; if(G.owner[t]!==pi||!(G.units[t].length||hasBuildings(t))) return; if(k&&ORD[k].t!=='D'&&!G.units[t].length) return; if(k&&usedOrders(pi).has(k)&&!(G.orders[t]&&G.orders[t].k===k)) return; G.orders[t]=k?{p:pi,k}:null; }
function palantirDone(){ startAttacks(); }

// ===== Фаза приказов (атаки) =====
function startAttacks(){ G.phase='attack'; G.arrived={}; G.ringUsed=false; G.idx=0; nextAttacker(); }
function attacksLeft(pi){ return G.orders.some((o,t)=>o&&o.p===pi&&ORD[o.k].t==='A'); }
function nextAttacker(){
  const list=alivePlayers();
  while(G.idx<list.length){ const pi=list[G.idx]; if(attacksLeft(pi)){ G.sel={stage:'from'}; return gate(pi,'Приказы: выполните свои приказы атаки.'); } G.idx++; }
  endRound();
}
function movable(t){ const a=(G.arrived&&G.arrived[t])||0; return Math.max(0,G.units[t].length-a); }
function attackPickFrom(t){ const o=G.orders[t]; if(!o||o.p!==G.cur||ORD[o.k].t!=='A') return; const m=movable(t); G.sel={stage:'to',from:t,k:o.k,take:G.units[t].map((_,i)=>i<m)}; }
function attackPickTo(t){ if(!ADJ[G.sel.from].has(t)) return; G.sel.to=t; G.sel.stage='units'; }
function afterAttackStep(){ if(attacksLeft(G.cur)){ G.sel={stage:'from'}; } else { G.sel=null; G.idx++; nextAttacker(); } }
function attackCancelOrder(){ G.orders[G.sel.from]=null; log(`${P(G.cur).f} снимает приказ атаки в «${D.names[G.sel.from]}».`); afterAttackStep(); }
function homeOwner(t){ const i=G.players.findIndex(p=>p.home===t&&p.alive); return i; }
function leaveOrigin(from,pi){ if(!G.units[from].length){ const h=homeOwner(from); if(h>=0) G.owner[from]=h; else if(hasBuildings(from)) G.owner[from]=pi; else G.owner[from]=-1; if(!G.orders[from]||G.orders[from].p!==G.owner[from]||ORD[G.orders[from].k].t!=='D') G.orders[from]=null; } }
function attackGo(){
  const s=G.sel, from=s.from, to=s.to, pi=G.cur;
  const m=movable(from); s.take=s.take.map((v,i)=>v&&i<m);
  const moving=G.units[from].filter((_,i)=>s.take[i]), staying=G.units[from].filter((_,i)=>!s.take[i]);
  if(G.arrived&&G.arrived[from]) G.arrived[from]=Math.min(G.arrived[from],staying.length);
  if(!moving.length) return 'Выберите хотя бы один отряд';
  const def=G.owner[to];
  const enemy = def!==-1 && def!==pi && (G.units[to].length || hasBuildings(to) || homeOwner(to)===def);
  if(!enemy){
    const total=(def===pi?G.units[to]:[]).concat(moving);
    if(total.length>CAP) return 'На территории может быть не больше '+CAP+' отрядов';
    G.orders[from]=null; G.units[from]=staying; G.units[to]=total; G.arrived[to]=((def===pi&&G.arrived[to])||0)+moving.length;
    if(def!==-1&&def!==pi) log(`${P(pi).f} занимает «${D.names[to]}».`); else log(`${P(pi).f}: поход «${D.names[from]}» → «${D.names[to]}».`);
    if(def!==pi && G.orders[to]) G.orders[to]=null;
    G.owner[to]=pi; leaveOrigin(from,pi); afterAttackStep(); return null;
  }
  G.orders[from]=null; G.units[from]=staying;
  G.battle={from,to,att:pi,def,moving,ok:s.k,sup:{},supQ:[],cards:{},adj:{a:0,d:0,as:0,ds:0,ash:0,dsh:0},ring:null,stage:'support',forceWin:null};
  for(const n of ADJ[to]){ const o=G.orders[n]; if(o&&ORD[o.k].t==='S'&&G.units[n].length) G.battle.supQ.push(n); }
  log(`${P(pi).f} атакует «${D.names[to]}» (${P(def).f}).`);
  nextSupport(); return null;
}
function nextSupport(){
  const b=G.battle;
  if(b.supQ.length){ const n=b.supQ[0]; return gate(G.orders[n].p,`Поддержка из «${D.names[n]}»: кого поддержать в бою за «${D.names[b.to]}»?`); }
  b.stage='cardA'; gate(b.att,'Бой: выберите карту героя (атака).');
}
function supportChoose(side){ const b=G.battle; const n=b.supQ.shift(); if(side) b.sup[n]=side; nextSupport(); }
function pickCard(i){
  const b=G.battle;
  if(b.stage==='cardA'){ b.cards.a=i; b.stage='cardD'; gate(b.def,'Бой: выберите карту героя (оборона).'); }
  else { b.cards.d=i; b.stage='reveal'; G.gate=null; G.cur=b.att; }
}
function battleCalc(){
  const b=G.battle, walls=hasWalls(b.to);
  const cA=HEROES[P(b.att).f][b.cards.a], cD=HEROES[P(b.def).f][b.cards.d];
  const dord=G.orders[b.to]; const dob=(dord&&dord.p===b.def&&ORD[dord.k].t==='D')?ORD[dord.k].b:0;
  let supA=0,supD=0;
  for(const [n,side] of Object.entries(b.sup)){ const o=G.orders[n]; if(!o) continue; const v=strength(G.units[n], side==='a'&&walls)+ORD[o.k].b; if(side==='a') supA+=v; else supD+=v; }
  const A={units:strength(b.moving,walls),order:ORD[b.ok].b,walls:0,support:supA,card:cA[1],ring:b.ring==='a'?1:0,adj:b.adj.a};
  const Dd={units:strength(G.units[b.to],false),order:dob,walls:G.units[b.to].length?(walls?3:0):(walls?3:1),support:supD,card:cD[1],ring:b.ring==='d'?1:0,adj:b.adj.d};
  const sum=o=>Object.values(o).reduce((x,y)=>x+y,0);
  return {A,Dd,totA:sum(A),totD:sum(Dd),cA,cD,swA:Math.max(0,cA[2]+b.adj.as),shA:Math.max(0,cA[3]+b.adj.ash),swD:Math.max(0,cD[2]+b.adj.ds),shD:Math.max(0,cD[3]+b.adj.dsh)};
}
function killN(list,k){ list=[...list]; const order=['о','п','к','э']; for(let i=0;i<k&&list.length;i++){ let j=-1; for(const u of order){ j=list.indexOf(u); if(j>=0) break; } list.splice(j,1); } return list; }
function battleResolve(){
  const b=G.battle, r=battleCalc(), fA=P(b.att).f, fD=P(b.def).f;
  let attWins = r.totA>r.totD || (r.totA===r.totD && G.ring.indexOf(b.att)<G.ring.indexOf(b.def));
  if(attWins){
    const loss=Math.max(0,r.swA-r.shD);
    const before=G.units[b.to].length; let surv=killN(G.units[b.to],loss); const killed=before-surv.length;
    surv=surv.filter(u=>u!=='о');
    let dest=null;
    if(surv.length){ dest=[...ADJ[b.to]].find(n=>n!==b.from && G.owner[n]===b.def && G.units[n].length+surv.length<=CAP) ?? [...ADJ[b.to]].find(n=>n!==b.from && G.owner[n]===-1 && !G.units[n].length); if(dest!=null){ G.units[dest]=G.units[dest].concat(surv); G.owner[dest]=b.def; } }
    const lostB=hasBuildings(b.to); G.bld[b.to]={};
    G.units[b.to]=b.moving; G.arrived[b.to]=b.moving.length; G.owner[b.to]=b.att; if(G.orders[b.to]) G.orders[b.to]=null;
    log(`Победа ${fA} (${r.totA}:${r.totD}) в «${D.names[b.to]}». ${fD}: потери ${killed}${surv.length?(dest!=null?`, отступление в «${D.names[dest]}»`:', отступать некуда — отряды уничтожены'):''}${lostB?', постройки разрушены':''}.`);
  } else {
    const loss=Math.max(0,r.swD-r.shA);
    const surv=killN(b.moving,loss).filter(u=>u!=='о');
    const back=G.units[b.from].concat(surv).slice(0,CAP); G.units[b.from]=back;
    if(back.length) G.owner[b.from]=b.att; else leaveOrigin(b.from,b.att);
    log(`${fD} отбивает атаку на «${D.names[b.to]}» (${r.totA}:${r.totD}). ${fA}: потери ${b.moving.length-surv.length}.`);
  }
  for(const [w,pi] of [['a',b.att],['d',b.def]]){ const p=P(pi), ci=b.cards[w]; p.hand=p.hand.filter(x=>x!==ci); p.discard.push(ci); if(!p.hand.length){ p.hand=p.discard.filter(x=>x!==ci); p.discard=[ci]; } }
  for(const n of Object.keys(b.sup)) G.orders[n]=null;
  if(b.ring) G.ringUsed=true;
  const att=b.att; G.battle=null; G.cur=att; checkElims(); if(G.phase==='over') return;
  afterAttackStep();
}
function checkElims(){
  G.players.forEach((p,pi)=>{ if(p.alive && terrCount(pi)===0){ p.alive=false; log(`${p.f} выбывает из игры.`); } });
  const alive=G.players.map((p,i)=>i).filter(i=>P(i).alive);
  if(alive.length===1){ G.winner=alive[0]; G.phase='over'; G.gate=null; log(`${P(alive[0]).f} захватывает Средиземье — победа!`); }
}
function endRound(){
  G.orders=Array(N).fill(null); checkElims(); if(G.phase==='over') return;
  G.round++; log(`Раунд ${G.round}.`); startBuild(true);
}
</script>
<script>// ===== Интерфейс v2 =====
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map'), cam=document.getElementById('cam');
const gT=document.getElementById('terr'), gU=document.getElementById('units');
const panel=document.getElementById('panel'), topb=document.getElementById('top'), gateEl=document.getElementById('gate');
const paths=[];
for(let t=0;t<N;t++){ const p=document.createElementNS(NS,'path'); p.setAttribute('d',D.d[t]); p.setAttribute('class','tr'); p.dataset.t=t; gT.appendChild(p); paths.push(p); }

let s=1,tx=0,ty=0; const VW=5120,VY0=660,VY1=4096;
function applyCam(){ cam.setAttribute('transform',`translate(${tx} ${ty}) scale(${s})`); }
function clamp(){ tx=Math.min(0,Math.max(VW-VW*s,tx)); ty=Math.min(VY0-VY0*s,Math.max(VY1-VY1*s,ty)); }
function toSvg(cx,cy){ const pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(cx,cy,k){ const p=toSvg(cx,cy); const ns=Math.min(8,Math.max(1,s*k)); k=ns/s; tx=p.x-(p.x-tx)*k; ty=p.y-(p.y-ty)*k; s=ns; clamp(); applyCam(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0015));},{passive:false});
const ptrs=new Map(); let moved=false, st=null, pinch=null;
svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false; st={x:e.clientX,y:e.clientY,tx,ty}; if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s}; } });
svg.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt((a.x+b.x)/2,(a.y+b.y)/2,(pinch.s*d/pinch.d)/s); moved=true; return; }
  const dx=e.clientX-st.x, dy=e.clientY-st.y; if(Math.hypot(dx,dy)>6) moved=true; if(moved){ const m=svg.getScreenCTM(); tx=st.tx+dx/m.a; ty=st.ty+dy/m.d; clamp(); applyCam(); } });
svg.addEventListener('pointerup',e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; if(!moved){ const el=document.elementFromPoint(e.clientX,e.clientY); const t=el&&el.dataset&&el.dataset.t; if(t!==undefined) clickT(+t); } });
svg.addEventListener('pointercancel',e=>{ ptrs.delete(e.pointerId); pinch=null; });

let focus=null, msg='';
function clickT(t){
  if(!G||G.gate) return; msg='';
  if(G.phase==='attack'&&G.sel&&!G.battle){
    if(G.sel.stage==='from') attackPickFrom(t);
    else if(G.sel.stage==='to'){ if(ADJ[G.sel.from].has(t)) attackPickTo(t); else attackPickFrom(t); }
  }
  focus=t; render();
}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hexA(h,a){ const n=parseInt(h.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function el(tag,attrs,text){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(text!=null) e.textContent=text; gU.appendChild(e); return e; }
const LIGHT=['#ffffff','#e6c23a','#8fb3d9','#c8892b'];

function viewer(){ return NET.on?myIndex():G.cur; }
function renderAny(){ render(); }
function render(){
  if(G&&NET.on&&G.gate&&G.gate.pi===myIndex()){ G.gate=null; focus=null; }
  if(G){ save(); if(NET.on){ const s0=JSON.stringify(G); if(s0!==NET.last){ G.v=(G.v||0)+1; save(); netPushState(); } } }
  for(let t=0;t<N;t++){ const o=G?G.owner[t]:-1, p=paths[t];
    p.style.fill=o>=0?hexA(fc(o),0.33):'transparent'; p.classList.toggle('sel',focus===t);
    let hl=false;
    if(G&&G.phase==='attack'&&G.sel&&!G.battle&&!G.gate){ if(G.sel.stage==='to'&&ADJ[G.sel.from].has(t)) hl=true; if(G.sel.stage==='from'){ const oo=G.orders[t]; if(oo&&oo.p===G.cur&&ORD[oo.k].t==='A') hl=true; } }
    if(G&&G.battle&&(t===G.battle.to||t===G.battle.from)) hl=true;
    p.classList.toggle('hl',hl);
  }
  gU.innerHTML='';
  if(G) for(let t=0;t<N;t++){
    const [x,y,r]=D.pt[t]; const k=Math.max(0.55,Math.min(1.1,r/70)); const o=G.owner[t];
    const icons=(CASTLE.has(t)?'♜':'')+(G.bld[t].fort?'🏰':'')+(G.bld[t].mine?'⛏':'')+(G.bld[t].barracks?'⛺':'');
    if(icons) el('text',{x,y:y-50*k,class:'tw','font-size':44*k},icons);
    const us=G.units[t];
    us.forEach((u,i)=>{ const cx=x+(i-(us.length-1)/2)*70*k; el('circle',{cx,cy:y,r:32*k,fill:fc(o),class:'un'}); el('text',{x:cx,y:y+12*k,'font-size':36*k,class:'ul',fill:LIGHT.includes(fc(o))?'#111':'#fff'},u.toUpperCase()); });
    if(!us.length&&o>=0) el('circle',{cx:x,cy:y,r:14*k,fill:'none',stroke:fc(o),'stroke-width':8*k});
    const od=G.orders[t];
    if(od){ const hidden=G.phase==='plan'&&(od.p!==viewer()||(!NET.on&&G.gate)); const bx=x-40*k, by=y+36*k;
      el('rect',{x:bx,y:by,width:80*k,height:46*k,rx:8*k,fill:hidden?'#333':'#1b140b',stroke:fc(od.p),'stroke-width':5*k});
      el('text',{x,y:by+33*k,'font-size':26*k,class:'ol'},hidden?'?':ORD[od.k].ic); }
  }
  if(!G){ topb.textContent='Игра Кольца'; gateEl.style.display='none'; if(NET.on) renderLobby(); else renderSetup(); return; }
  const ph={build:'Владычество',plan:'Замыслы',palantir:'Палантир',attack:'Приказы',over:'Игра окончена'}[G.phase];
  topb.innerHTML=`<b>Раунд ${G.round}</b> · ${ph}${G.cur!=null&&G.phase!=='over'?` · <span class="fdot" style="background:${fc(G.cur)}"></span>${esc(P(G.cur).f)}`:''}`;
  if(NET.on){ const me=myIndex(); topb.innerHTML+=me!=null?` · вы: <span class="fdot" style="background:${fc(me)}"></span>${esc(P(me).f)}`:' · зритель'; }
  if(G.gate&&!NET.on){ gateEl.style.display='flex'; gateEl.innerHTML=`<div class="gbox"><div class="fdot big" style="background:${fc(G.gate.pi)}"></div><h2>Передайте устройство: ${esc(P(G.gate.pi).f)}</h2><p>${esc(G.gate.msg)}</p><button class="main" onclick="G.gate=null;focus=null;render()">Я — ${esc(P(G.gate.pi).f)}, показать</button></div>`; }
  else gateEl.style.display='none';
  renderPanel();
}
function playersBox(){
  return `<div class="pl"><div class="pr hd"><span></span><span>Фракция</span><span>🪙</span><span>Терр.</span><span title="Аркенстон / Палантир / Кольцо">А/П/К</span></div>`+G.arken.map(pi=>{ const p=P(pi); return `<div class="pr ${p.alive?'':'dead'}"><span class="fdot" style="background:${fc(pi)}"></span><b>${esc(p.f)}</b><span>${p.coins}</span><span>${terrCount(pi)}</span><span>${G.arken.indexOf(pi)+1}/${G.palantir.indexOf(pi)+1}/${G.ring.indexOf(pi)+1}</span></div>`; }).join('')+`</div>`;
}
function terrInfo(t){ if(t==null) return ''; const o=G.owner[t], b=G.bld[t];
  const bl=[CASTLE.has(t)?'замок':'',b.fort?'крепость':'',b.mine?'шахта':'',b.barracks?'казарма':''].filter(Boolean).join(', ');
  return `<div class="ti"><b>${esc(D.names[t])}</b>${bl?' · '+bl:''}<br>${o>=0?esc(P(o).f):'ничья'} · ${G.units[t].length?G.units[t].map(u=>UNIT[u].name).join(', '):'нет войск'}<br><small>Соседи: ${[...ADJ[t]].map(n=>esc(D.names[n])).join(', ')}</small></div>`; }
function btn(label,js,dis,cls){ return `<button ${dis?'disabled':''} class="${cls||''}" onclick="${js}">${label}</button>`; }
function act(t,w){ msg=buyAt(t,w)||''; render(); }
function renderPanel(){
  let h=msg?`<div class="msg">${esc(msg)}</div>`:'';
  const pi=G.cur;
  const waiting = NET.on && G.phase!=='over' && (G.gate ? G.gate.pi!==myIndex() : pi!==myIndex()) && !(G.battle&&G.battle.stage==='reveal'&&myIndex()===G.battle.def);
  if(NET.on) h+=`<div class="net">Комната <b>${NET.room}</b> · ${esc(NET.status)}</div>`;
  if(G.phase==='over'){ h+=`<h3>Победа: ${esc(P(G.winner).f)}</h3>`; }
  else if(waiting){ const w=G.gate?G.gate.pi:pi; h+=`<p class="wait">Ходит <span class="fdot" style="background:${fc(w)}"></span><b>${esc(P(w).f)}</b>${P(w).name?' ('+esc(P(w).name)+')':''}. Ждём…</p>${G.gate?`<p><small>${esc(G.gate.msg)}</small></p>`:''}`; if(G.battle&&G.battle.stage==='reveal') h+=battlePanel(true); }
  else if(G.gate){ h+=`<p>Ожидание: ${esc(P(G.gate.pi).f)}</p>`; }
  else if(G.phase==='build'){
    h+=`<h3>Владычество</h3><p>Монет: <b>${P(pi).coins}</b>. Указов: <b>${decreeLimit(pi)-(G.decrees||0)}</b> из ${decreeLimit(pi)}. Выберите свою территорию на карте.</p>`;
    if(focus!=null&&G.owner[focus]===pi){ const t=focus, rec=canRecruitAt(t), w=hasWalls(t), b=G.bld[t];
      h+=terrInfo(t)+`<div class="ob">`+
      btn('Пехота — 1🪙',`act(${t},'п')`,!rec)+btn('Осадное орудие — 1🪙',`act(${t},'о')`,!rec)+
      btn('Пехота → кавалерия — 1🪙',`act(${t},'up_к')`,!rec)+btn('Кавалерия → элита — 1🪙',`act(${t},'up_э')`,!rec)+
      btn('Шахта — 1🪙',`act(${t},'mine')`,w||b.mine)+btn('Казарма — 1🪙',`act(${t},'barracks')`,w||b.barracks)+
      btn('Крепость — 3🪙',`act(${t},'fort')`,CASTLE.has(t)||b.fort||hasFort(pi))+(b.fort?btn('Разрушить крепость',`if(confirm('Разрушить крепость?'))act(${t},'destroyFort')`):'')+`</div>`+(G.units[t].length?`<div class="ob">`+[...new Set(G.units[t])].map(x=>btn('Распустить: '+UNIT[x].name.toLowerCase(),`act(${t},'disband_${x}')`)).join('')+`</div>`:'');
      if(!rec) h+=`<p><small>Нанимать и улучшать войска можно в замке, крепости или там, где есть казарма.</small></p>`;
    } else if(focus!=null) h+=terrInfo(focus);
    h+=`<p><small>Лимиты: пехота ${count(pi,'п')}/7, кавалерия ${count(pi,'к')}/5, элита ${count(pi,'э')}/1, осадные ${count(pi,'о')}/3, крепость ${hasFort(pi)?1:0}/1. Доход в начале раунда: ${income(pi)}🪙.</small></p>`+btn('Готово — передать ход','buildDone();focus=null;render()',false,'main');
  }
  else if(G.phase==='plan'||G.phase==='palantir'){
    const used=usedOrders(pi);
    h+=G.phase==='plan'?`<h3>Замыслы</h3><p>Нажмите на свою территорию и выберите приказ. Каждый приказ — один раз.</p>`:`<h3>Палантир</h3><p>Все приказы раскрыты. Вы можете заменить один свой приказ.</p>`;
    if(focus!=null&&G.owner[focus]===pi&&(G.units[focus].length||hasBuildings(focus))){ const cur=G.orders[focus];
      h+=`<div class="ti"><b>${esc(D.names[focus])}</b></div><div class="ob">`+Object.keys(ORD).map(k=>btn(ORD[k].label,`setOrder(${focus},'${k}');${G.phase==='palantir'?'palantirDone();':''}render()`,(used.has(k)&&!(cur&&cur.k===k))||(ORD[k].t!=='D'&&!G.units[focus].length)||(G.phase==='palantir'&&!cur),cur&&cur.k===k?'on':'')).join('')+(G.phase==='plan'?btn('Убрать',`setOrder(${focus},null);render()`):'')+`</div>`;
    } else if(focus!=null) h+=terrInfo(focus);
    if(G.phase==='plan'){ const mine=[]; for(let t=0;t<N;t++) if(G.owner[t]===pi&&(G.units[t].length||hasBuildings(t))) mine.push(`<span class="${G.orders[t]?'ok':'no'}" onclick="focus=${t};render()">${esc(D.names[t])}${G.orders[t]?' · '+ORD[G.orders[t].k].label:''}</span>`);
      h+=`<div class="ml">${mine.join('')}</div><p><small>Свободные приказы: ${Object.keys(ORD).filter(k=>!used.has(k)).map(k=>ORD[k].label).join(', ')||'нет'}</small></p>`+btn('Готово — передать ход','planDone();focus=null;render()',false,'main'); }
    else h+=btn('Ничего не менять','palantirDone();focus=null;render()',false,'main');
  }
  else if(G.phase==='attack'&&G.battle){ h+=battlePanel(); }
  else if(G.phase==='attack'&&G.sel){ const sl=G.sel;
    const atk=[]; for(let t=0;t<N;t++){ const o=G.orders[t]; if(o&&o.p===pi&&ORD[o.k].t==='A') atk.push(t); }
    h+=`<p><b>Откуда атаковать сейчас?</b> Выберите территорию кнопкой или на карте.</p><div class="ob">`+atk.map(t=>btn(esc(D.names[t])+' · '+ORD[G.orders[t].k].label+(movable(t)?'':' (нет свободных войск)'),`attackPickFrom(${t});focus=${t};render()`,false,sl.from===t?'on':'')).join('')+`</div>`;
    if(sl.stage==='to') h+=`<p>Атака из «${esc(D.names[sl.from])}» (${ORD[sl.k].label}). Выберите соседнюю территорию.</p>`+btn('Снять приказ без атаки','attackCancelOrder();render()');
    if(sl.stage==='units'){ const o=G.owner[sl.to]; h+=`<p><b>${esc(D.names[sl.from])} → ${esc(D.names[sl.to])}</b>${o>=0&&o!==pi?` (${esc(P(o).f)})`:''}</p><p>Какие отряды идут:</p>`+G.units[sl.from].map((u,i)=>i<movable(sl.from)?`<label class="ck"><input type="checkbox" ${sl.take[i]?'checked':''} onchange="G.sel.take[${i}]=this.checked">${UNIT[u].name}</label>`:`<label class="ck" style="opacity:.5"><input type="checkbox" disabled>${UNIT[u].name} — уже ходил в этом раунде</label>`).join('')+
      (G.sel.take.every(x=>x)&&!hasBuildings(sl.from)&&homeOwner(sl.from)<0?`<p><small>Если уйдут все, «${esc(D.names[sl.from])}» станет ничьей.</small></p>`:'')+
      `<div class="ob">`+btn('В поход',"msg=attackGo()||'';render()",false,'main')+btn('Другая цель',"G.sel.stage='to';render()")+`</div>`; }
  }
  if(!['build','plan','palantir'].includes(G.phase)&&focus!=null&&!G.battle) h+=terrInfo(focus);
  h+=playersBox();
  h+=`<details><summary>Ручная правка (для свойств карт)</summary>${editBox()}</details>`;
  h+=`<details><summary>Журнал</summary><div class="log">${G.log.slice().reverse().map(esc).join('<br>')}</div></details>`;
  h+=`<details><summary>Правила кратко</summary>${RULES}</details>`;
  h+=`<p>`+btn('Новая игра',"if(confirm('Начать новую игру? Текущая будет удалена.'))resetGame()")+`</p>`;
  panel.innerHTML=h;
}
function battlePanel(ro){
  const b=G.battle;
  if(b.stage==='support'){ const n=b.supQ[0]; return `<h3>Поддержка из «${esc(D.names[n])}»</h3><p>${esc(P(b.att).f)} атакует ${esc(P(b.def).f)} в «${esc(D.names[b.to])}».</p><div class="ob">`+btn('За '+esc(P(b.att).f),"supportChoose('a');render()")+btn('За '+esc(P(b.def).f),"supportChoose('d');render()")+btn('Никого','supportChoose(null);render()')+`</div>`; }
  if(b.stage==='cardA'||b.stage==='cardD'){ const pi=b.stage==='cardA'?b.att:b.def, p=P(pi), H=HEROES[p.f];
    return `<h3>${esc(p.f)}: выберите героя</h3><p>Бой за «${esc(D.names[b.to])}».</p><div class="cards">`+p.hand.map(i=>{ const c=H[i]; return `<div class="card" onclick="pickCard(${i});render()"><div class="cs">${c[1]}</div><b>${esc(c[0])}</b><div>${'🗡'.repeat(c[2])}${'🛡'.repeat(c[3])}</div><small>${esc(c[4])}</small></div>`; }).join('')+`</div><p><small>Сброс: ${p.discard.map(i=>esc(H[i][0])).join(', ')||'—'}</small></p>`; }
  const r=battleCalc(), fA=P(b.att).f, fD=P(b.def).f;
  const row=(l,a,d)=>`<tr><td>${l}</td><td>${a}</td><td>${d}</td></tr>`;
  const pm=(key,v)=>`<button onclick="G.battle.adj.${key}--;render()">−</button>${v}<button onclick="G.battle.adj.${key}++;render()">+</button>`;
  const rt=G.ring.find(i=>P(i).alive); const canRing=!G.ringUsed&&!b.ring&&(rt===b.att||rt===b.def)&&(!NET.on||myIndex()===rt);
  return `<h3>Бой за «${esc(D.names[b.to])}»</h3><table class="bt"><tr><th></th><th style="color:${fc(b.att)}">${esc(fA)}</th><th style="color:${fc(b.def)}">${esc(fD)}</th></tr>
  ${row('Войска',r.A.units,r.Dd.units)}${row('Приказ',r.A.order,r.Dd.order)}${row(G.units[b.to].length?'Замок / крепость':'Пустая территория','',r.Dd.walls)}${row('Поддержка',r.A.support,r.Dd.support)}${row('Герой',r.A.card,r.Dd.card)}${row('Кольцо',r.A.ring,r.Dd.ring)}${row('Правка силы',pm('a',r.A.adj),pm('d',r.Dd.adj))}
  <tr class="tot"><td>Итого</td><td>${r.totA}</td><td>${r.totD}</td></tr>${row('Мечи 🗡',pm('as',r.swA),pm('ds',r.swD))}${row('Щиты 🛡',pm('ash',r.shA),pm('dsh',r.shD))}</table>
  <div class="cards two"><div class="card"><div class="cs">${r.cA[1]}</div><b>${esc(r.cA[0])}</b><small>${esc(r.cA[4])}</small></div><div class="card"><div class="cs">${r.cD[1]}</div><b>${esc(r.cD[0])}</b><small>${esc(r.cD[4])}</small></div></div>
  <p><small>Свойства героев применяйте кнопками правки. Если свойства спорят, первым действует тот, кто выше на треке Палантира. При равенстве сил побеждает тот, кто выше на треке Кольца.</small></p>
  ${(ro&&!canRing)?'':(canRing?btn(`Использовать Кольцо (+1, ${esc(P(rt).f)})`,`G.battle.ring='${rt===b.att?'a':'d'}';render()`):'')}
  <div class="ob">${(NET.on&&myIndex()!==b.att)?'<small>Бой завершает атакующий</small>':btn('Завершить бой','battleResolve();render()',false,'main')}</div>`;
}
function editBox(){
  if(focus==null) return '<p>Нажмите на территорию на карте.</p>';
  const t=focus, o=G.owner[t];
  return `<div class="ti"><b>${esc(D.names[t])}</b></div><label>Владелец: <select onchange="G.owner[${t}]=+this.value;render()"><option value="-1">ничья</option>${G.players.map((p,i)=>`<option value="${i}" ${o===i?'selected':''}>${esc(p.f)}</option>`).join('')}</select></label>
  <div class="ob">${Object.keys(UNIT).map(u=>btn('+ '+UNIT[u].name,`if(G.units[${t}].length<CAP)G.units[${t}].push('${u}');render()`)+btn('− '+UNIT[u].name,`const i=G.units[${t}].indexOf('${u}');if(i>=0)G.units[${t}].splice(i,1);render()`)).join('')}</div>
  <div class="ob">${[['mine','шахта'],['barracks','казарма'],['fort','крепость']].map(([k,n])=>btn((G.bld[t][k]?'Убрать ':'Поставить ')+n,`if(G.bld[${t}].${k})delete G.bld[${t}].${k};else G.bld[${t}].${k}=true;render()`)).join('')}${btn('Снять приказ',`G.orders[${t}]=null;render()`)}</div>
  <div class="ob">${G.players.map((p,i)=>`<span class="cn"><span class="fdot" style="background:${fc(i)}"></span>🪙<button onclick="P(${i}).coins=Math.max(0,P(${i}).coins-1);render()">−</button>${p.coins}<button onclick="P(${i}).coins++;render()">+</button></span>`).join('')}</div>
  <p><small>Треки (сверху — первое место). ↑ поднимает фракцию.</small></p>
  ${[['arken','Аркенстон'],['palantir','Палантир'],['ring','Кольцо']].map(([k,nm])=>`<div class="trk"><b>${nm}:</b> ${G[k].map((pi,j)=>`<span><span class="fdot" style="background:${fc(pi)}"></span>${esc(P(pi).f)}${j?`<button onclick="const a=G['${k}'];[a[${j-1}],a[${j}]]=[a[${j}],a[${j-1}]];render()">↑</button>`:''}</span>`).join(' ')}</div>`).join('')}`;
}
function renderSetup(){
  const saved=lsGet('ring_room'), role=lsGet('ring_role');
  panel.innerHTML=`<h3>Онлайн-игра</h3><p>Каждый играет со своего телефона или компьютера. Создайте комнату и отправьте ссылку друзьям.</p>
  <button class="main" onclick="hostRoom()">Создать комнату</button>
  ${saved?`<button onclick="${role==='host'?`hostRoom('${saved}')`:`joinRoom('${saved}')`}">Вернуться в комнату ${saved}</button>`:''}
  <p><input id="jc" placeholder="Код комнаты" style="width:120px;text-transform:uppercase"> <button onclick="const v=document.getElementById('jc').value.trim().toUpperCase();if(v)joinRoom(v)">Войти</button></p>
  <hr><h3>На одном устройстве</h3><p>Выберите от 2 до 6 фракций и передавайте устройство друг другу.</p><div class="fs">`+Object.keys(FACTIONS).map(f=>`<label class="ck"><input type="checkbox" value="${esc(f)}"><span class="fdot" style="background:${FACTIONS[f].c}"></span>${esc(f)} <small>— ${esc(FACTIONS[f].home)}</small></label>`).join('')+`</div><button class="main" onclick="startFromSetup()">Начать</button><details><summary>Правила кратко</summary>${RULES}</details>`;
}
function renderLobby(){
  const L=NET.lobby||{players:[]}; const mine=L.players.find(p=>p.tok===NET.tok); const j=(()=>{ try{ return JSON.parse(lsGet('ring_join')||'{}'); }catch(e){ return {}; } })();
  const taken=new Set(L.players.filter(p=>p.tok!==NET.tok).map(p=>p.f));
  panel.innerHTML=`<h3>Комната ${NET.room}</h3><div class="net">${esc(NET.status)}</div>
  <p>Ссылка для друзей:</p><input id="lnk" readonly value="${roomLink()}" style="width:100%;box-sizing:border-box;font-size:13px" onclick="this.select()"><button onclick="navigator.clipboard&&navigator.clipboard.writeText('${roomLink()}');this.textContent='Скопировано'">Копировать ссылку</button>
  <h4>Игроки (${L.players.length}/6)</h4>${L.players.map(p=>`<div class="pr"><span class="fdot" style="background:${FACTIONS[p.f].c}"></span><b>${esc(p.f)}</b><span>${esc(p.name)}</span><span>${p.tok===NET.tok?'вы':''}</span><span></span></div>`).join('')||'<p>Пока никого.</p>'}
  <h4>${mine?'Изменить':'Выбрать'} фракцию</h4><p><input id="nm" placeholder="Ваше имя" value="${esc(mine?mine.name:(j.name||''))}"></p>
  <select id="fsel">${Object.keys(FACTIONS).filter(f=>!taken.has(f)).map(f=>`<option ${mine&&mine.f===f?'selected':''}>${esc(f)}</option>`).join('')}</select>
  <button onclick="lobbyJoin()">${mine?'Сохранить':'Присоединиться'}</button>
  ${NET.host?`<p><button class="main" onclick="hostStart()" ${L.players.length<2?'disabled':''}>Начать игру</button></p><p><small>Вы — хост. Не закрывайте эту страницу во время игры: через вас идёт связь.</small></p>`:'<p>Ждём, пока хост начнёт игру.</p>'}
  <p><button onclick="leaveOnline()">Выйти из комнаты</button></p><details><summary>Правила кратко</summary>${RULES}</details>`;
}
function lobbyJoin(){ const name=(document.getElementById('nm').value||'Игрок').slice(0,20), f=document.getElementById('fsel').value; if(!f) return;
  if(NET.host){ const L=NET.lobby; const ex=L.players.find(p=>p.tok===NET.tok); if(ex){ex.name=name;ex.f=f;} else L.players.push({tok:NET.tok,name,f}); lsSet('ring_join',JSON.stringify({name,f})); netSend({t:'lobby',L}); render(); }
  else guestJoin(name,f); }
function startFromSetup(){ const f=[...panel.querySelectorAll('.fs input:checked')].map(i=>i.value); if(f.length<2||f.length>6){ alert('Нужно от 2 до 6 фракций'); return; } focus=null; newGame(f); render(); }
function resetGame(){ if(NET.on){ leaveOnline(); return; } G=null; try{localStorage.removeItem(LS);}catch(e){} focus=null; render(); }
const RULES=`<ol class="rules">
<li><b>Цель.</b> Захватить всю карту и уничтожить всех противников. Число раундов не ограничено.</li>
<li><b>Старт.</b> У каждой фракции одна родовая земля, на ней 1 пехота, и 3 монеты.</li>
<li><b>Раунд.</b> Замыслы (тайные приказы) → Палантир → Приказы (атаки) → Владычество (доход, найм, стройка). Ходят в порядке трека Аркенстона, каждый выполняет все свои атаки.</li>
<li><b>Доход.</b> +1 за шахту, +1 за замок, +1 за крепость, +1 первому на Аркенстоне. Первый раунд начинается сразу с приказов, без покупок.</li>
<li><b>Войска.</b> Пехота 1 (лимит 7), кавалерия 2 (5), элита 3 (1), осадное орудие 4 против замка или крепости, иначе 0 (3). Не больше 3 отрядов на территории.</li>
<li><b>Указы.</b> Во владычество каждый делает до 5 действий (первый на Аркенстоне — до 6): найм, улучшение, стройка, роспуск отряда (бесплатно), разрушение крепости.</li>
<li><b>Найм и улучшение</b> — только в замке, крепости или где есть казарма: пехота 1, осадное 1, пехота → кавалерия 1, кавалерия → элита 1.</li>
<li><b>Постройки.</b> Шахта 1, казарма 1 — не там, где замок или крепость. Крепость 3, одна на фракцию, не на замке. Замок и крепость: +3 к обороне, заменяют шахту и казарму.</li>
<li><b>Ход.</b> Войска идут только в соседнюю территорию и только на один шаг за раунд: отряд, который уже пришёл в этом раунде, дальше не идёт.</li>
<li><b>Приказы.</b> 7 штук, каждый один раз: атака +1, 0, −1; защита +2, +1; поддержка +1, 0. Ставятся на свои территории.</li>
<li><b>Палантир.</b> Первый на треке после раскрытия может заменить один свой приказ. Его свойства карт действуют первыми.</li>
<li><b>Бой.</b> Сила = войска + приказ + замок/крепость (+3, у обороны) + поддержка + герой. Мечи победителя убивают, щиты проигравшего защищают. Проигравший отступает: защитник — в соседнюю свою или пустую территорию, атакующий — назад. Осадные орудия не отступают. Постройки проигравшего защитника разрушаются.</li>
<li><b>Пустая территория.</b> Если на своей территории нет войск, при атаке она защищается силой 1, а если там замок или крепость — силой 3.</li>
<li><b>Кольцо.</b> При равенстве сил побеждает тот, кто выше на треке Кольца. Первый на треке раз за фазу может добавить +1.</li>
<li><b>Контроль.</b> Ушли все войска — территория ничья, если на ней нет ваших построек. Родовая земля всегда остаётся за своей фракцией: даже пустую её можно взять только боем, а если захватчик уйдёт из неё, она вернётся владельцу.</li></ol>`;
(function boot(){
  const m=location.hash.match(/room=([A-Z0-9]+)/i);
  if(m){ const room=m[1].toUpperCase(); if(lsGet('ring_role')==='host'&&lsGet('ring_room')===room){ NET.on=true; NET.room=room; G=load(); if(G&&G.round===1&&G.phase==='build') startPlan(); hostRoom(room); } else { NET.on=true; NET.room=room; G=load(); joinRoom(room); } }
  else { G=load(); }
  // старые сохранения: первый раунд начинался с покупок — переводим сразу в приказы
  if(G&&G.round===1&&G.phase==='build'&&(!NET.on||NET.host)) startPlan();
  render();
})();
// хост пишет ссылку в адресную строку
const _hostRoom=hostRoom; hostRoom=function(r){ _hostRoom(r); if(!location.hash.includes(NET.room)) history.replaceState(null,'','#room='+NET.room); };
